name: astrbot_phone_control_mirror
display_name: 手机操控
short_desc: 把安卓模拟器变成 AstrBot 的“手机”：远程 ADB/scrcpy 控制，AI 可自主浏览/玩手机、打开任意 App，理解内容并记录浏览日志、学习档案与 App 经验；支持持续刷、随机玩、定时任务与用户任务优先，命令/工具/定时任务共用统一设备执行入口（授权、占用、暂停、取消代次、期限一致）。人机验证/做题自动处理，按答题进度与挑战解除做结构化判定，失败有限次后暂停并通知人工接管；评论/被动回复/发帖可开关并限额冷却，分享强制带链接或截图；提供实时屏幕、OCR 与流媒体内容识别；token 按 provider_stats 对账、自主任务模型可选；内置监控与资料管理面板；支持 WireGuard userspace 组网（client/server，手机装 WG App 接入）。主动互动默认关闭，短信/邮箱验证码与人脸实名交用户处理。
desc: |
  使用风险：使用本插件的自动化操作、互动发布、组网与抓包功能，使用者须自行承担全部风险，包括账号限流、封禁、设备级封锁及其他损失；请自行确认平台规则与操作授权。

  把一台安卓模拟器（配置 ADB 地址与端口后启用）变成 AstrBot 的“手机”：主 Agent 可查看设备状态与 UI 树、点击/滑动/输入、打开任意已安装 App，按自身人格自主浏览、理解内容，并写入浏览日志、学习档案与 App 使用经验。

  支持持续刷手机、随机玩手机、定时任务与用户任务优先；命令、LLM 工具与定时任务共用统一设备执行入口（授权、设备占用、暂停、取消代次与执行期限一致）。人机验证/做题自动识别并执行，按答题进度与挑战是否解除做结构化判定，失败有限次后暂停手机、保留验证页面并通知用户人工接管；等待超时仍保持暂停，需显式取消。

  主动评论、被动回复与发帖默认关闭；开启后先申请名额再用低层工具完成操作并记录结果，插件只做授权、限额、冷却与记账（开关属于流程约定与配额控制，不是底层动作拦截）。分享必须带链接或截图。另提供实时屏幕、OCR、流媒体内容识别、抓包与 token 实际 usage 对账、监控与资料管理面板；短信/邮箱验证码、人脸与实名认证仍交用户处理。


help: /phone help 查看全部指令。常用：/phone status、/phone browse 微信 5、/phone task 去B站看视频总结（后台执行）、/phone tasks、/phone quota [audit [小时]]、/phone play [tokens]、/phone interactions、/phone continuous on|off|status、/phone learn [关键词|条数]、/phone novelty [status|reset]、/phone watch [秒数]、/phone stop [job_id|all]、/phone wg [status|start|stop|restart|config]。
